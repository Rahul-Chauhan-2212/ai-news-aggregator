version: "3.9"

services:
  app:
    build: .
    container_name: ai-news-app
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/newsdb
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      EMAIL: ${EMAIL}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD}
      AI_PROVIDER: openai
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OLLAMA_URL: ${OLLAMA_URL}
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: ai-news-db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: newsdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      
  pgadmin:
    image: dpage/pgadmin4
    container_name: ai-news-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  postgres_data: